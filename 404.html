<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      🔴 F2 (аудит 2026-08, находка 2): защитный CSP. Главный барьер против
      исполнения кода из документа Word — санитайзер HTML в FilePreview; этот CSP
      — второй рубеж и жёстко закрывает плагины (object-src), подмену <base>
      (base-uri) и встраивание окна (frame-ancestors). script-src здесь оставлен
      совместимым с dev-сервером Vite (inline/eval при HMR); жёсткий 'self' для
      скриптов ставится на уровне main-процесса Electron для прод-сборки (session
      CSP), где инлайн-скриптов уже нет.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https: ws: wss:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <!--
      Фирменный знак «dm» во вкладке браузера. Файлы производятся из
      brand/logo.png генератором scripts/gen-brand-icons.py — руками не править,
      иначе иконка сайта разойдётся с иконкой программы.
      favicon.ico держит несколько размеров сразу (16…256): браузер берёт нужный
      сам, а старые версии понимают только .ico. PNG — для современных,
      apple-touch-icon — для плитки на iPhone/iPad.
    -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Приватная зона SaaS: не индексировать (IP-PROTECTION §7) -->
    <meta name="robots" content="noindex, nofollow" />
    <title>DaatMed.co.il</title>
    <script type="module" crossorigin src="./assets/index-Bgu1njuR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-cszVZCPp.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
